services:
  bread-calculator:
    image: bread-calculator:${BREAD_REVISION:-local}
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8078:8080"
    environment:
      MEALIE_URL: ${MEALIE_URL:-}
      MEALIE_TOKEN: ${MEALIE_TOKEN:-}
    volumes:
      - recipes:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    labels:
      com.centurylinklabs.watchtower.enable: "false"
volumes:
  recipes:
