name: Check calculator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - run: docker compose config --quiet
      - run: docker build --label org.opencontainers.image.source=https://github.com/altamashka/bread-calculator --label org.opencontainers.image.revision=${{ github.sha }} -t bread-calculator:test .
      - name: Check image health and page
        run: |
          docker run -d --name bread-check -p 127.0.0.1:8078:8080 --mount type=volume,target=/app/data --read-only --tmpfs /tmp --cap-drop ALL bread-calculator:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8078/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8078/ | grep -q 'Bread calculator'
          curl -fsS http://127.0.0.1:8078/methods | grep -q 'Method steps'
          curl -fsS http://127.0.0.1:8078/bakes | grep -q 'Record a bake'
          curl -fsS http://127.0.0.1:8078/bake | grep -q 'Weigh ingredients'
          docker exec bread-check node -e "fetch('http://127.0.0.1:8080/api/recipes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipe:{name:'CI dough'}})}).then(r=>{if(!r.ok)process.exit(1)})"
          docker exec -i bread-check node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:8080';
          async function post(path,value){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});assert.equal(r.status,200);return r.json();}
          await post('/api/blends',{blend:{name:'CI blend',wholeWheat:20,rye:10}});
          const m=await post('/api/methods',{method:{name:'CI method',steps:[{title:'Autolyse',instructions:'Mix flour and water.',restMinutes:30}]}});
          const r=await post('/api/recipes',{recipe:{name:'CI method recipe',method:{id:m.id,savedAt:m.updatedAt,...m.method}}});
          await post('/api/bakes',{bake:{date:'2026-10-15',recipe:r.recipe,rating:4}});
          const archive=await (await fetch(base+'/api/archive')).json();
          assert.equal(archive.blends.length,1);assert.equal(archive.methods.length,1);assert.equal(archive.bakes.length,1);
          JS
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' bread-check)" = healthy ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify backup and isolated restore
        run: |
          bash -n scripts/backup.sh scripts/restore-check.sh scripts/auto-deploy.sh
          export BREAD_BACKUP_DIR="$RUNNER_TEMP/bread-backups"
          export BREAD_CONTAINER=bread-check
          export BREAD_VOLUME=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Name}}{{end}}{{end}}' bread-check)
          bash scripts/backup.sh
          archive=$(find "$BREAD_BACKUP_DIR" -name 'bread-*.tar.gz' | sort | tail -1)
          bash scripts/restore-check.sh "$archive" bread-calculator:test
      - name: Save tested release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save bread-calculator:test | gzip > "$RUNNER_TEMP/bread-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: bread-release-image
          path: ${{ runner.temp }}/bread-image.tar.gz
          retention-days: 1
      - name: Container diagnostics
        if: failure()
        run: docker logs bread-check || true

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: bread-publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bread-release-image
          path: ${{ runner.temp }}
      - name: Load tested image
        run: docker load --input "$RUNNER_TEMP/bread-image.tar.gz"
      - name: Publish only the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/altamashka/bread-calculator/git/ref/heads/main --jq .object.sha)
          if [ "$latest" != "$REVISION" ]; then
            echo 'A newer main revision exists; skipping superseded release.'
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker tag bread-calculator:test "ghcr.io/altamashka/bread-calculator:$REVISION"
          docker push "ghcr.io/altamashka/bread-calculator:$REVISION"
          docker tag "ghcr.io/altamashka/bread-calculator:$REVISION" ghcr.io/altamashka/bread-calculator:main
          docker push ghcr.io/altamashka/bread-calculator:main
