<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>Bake · Bread Bench</title>
    <link rel="stylesheet" href="/style.css" /><script type="module" src="/bake-mode.mjs"></script>
  </head>
  <body>
    <main class="bake-mode">
      <header class="app-header"><h1>Bake</h1><nav aria-label="Main navigation"><a href="/">Calculator</a><a href="/methods">Methods</a><a href="/bakes">Bake log</a></nav></header>
      <p id="status" role="status" aria-live="polite">Opening saved recipe…</p>
      <section id="bakeSession" class="panel" hidden>
        <p class="eyebrow">SAVED FORMULA · READ ONLY</p><h2 id="recipeTitle"></h2><p id="batchSummary" class="hint"></p>
        <p id="snapshotHint" class="hint"></p>
        <div class="bake-tabs" role="group" aria-label="Baking view"><button id="weighTab" aria-pressed="true">Weigh ingredients</button><button id="methodTab" aria-pressed="false">Follow method</button></div>
        <div class="bake-columns">
        <section id="weighPanel" aria-label="Weigh ingredients"><h2>Ingredients</h2>
          <label for="weighLayout">Weighing layout</label><select id="weighLayout"><option value="checklist">Checklist</option><option value="focus">One ingredient at a time</option></select>
          <p id="weighedProgress" role="status" aria-live="polite"></p><div id="weighList"></div><div id="focusIngredient" hidden></div>
        </section>
        <section id="methodPanel" aria-label="Follow method" hidden>
          <h2>Method</h2>
          <p id="stepProgress" role="status" aria-live="polite"></p><h3 id="stepTitle"></h3><p id="stepInstructions" class="step-instructions"></p><p id="stepRest" class="hint"></p>
          <label id="stepCheck" class="weigh-row"><input id="stepDone" type="checkbox" /><span>Step completed</span></label>
          <div class="bake-step-actions"><button id="previousStep">Previous step</button><button id="nextStep">Next step</button></div>
          <details open><summary>All method steps</summary><div id="methodSteps" class="method-step-list" role="group" aria-label="Method steps"></div></details>
        </section>
        </div>
        <p class="hint">Progress stays in this browser tab. Your formula and method stay unchanged. Save a bake result to keep a permanent record.</p>
        <div class="bake-step-actions"><a id="editRecipe" class="button-link">Edit recipe</a><button id="newSession">Start a new bake</button></div>
      </section>
      <div class="bake-bottom"><a id="recordResult" class="button-link primary" hidden>Record bake result</a></div>
    </main>
  </body>
</html>
